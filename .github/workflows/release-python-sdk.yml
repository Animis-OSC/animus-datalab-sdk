name: Release Python SDK

on:
  push:
    tags:
      - "sdk-python-v*"

permissions:
  contents: read
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi

    defaults:
      run:
        working-directory: python

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: python/pyproject.toml

      - name: Install release tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate version matches tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          PREFIX="sdk-python-v"
          if [[ "$TAG" != ${PREFIX}* ]]; then
            echo "Unexpected tag: $TAG"
            exit 1
          fi

          RELEASE_VERSION="${TAG#$PREFIX}"
          SDK_VERSION="$(python -c 'from animus_sdk import __version__; print(__version__)')"
          echo "tag=$RELEASE_VERSION sdk=$SDK_VERSION"

          if [[ "$RELEASE_VERSION" != "$SDK_VERSION" ]]; then
            echo "Tag version does not match animus_sdk.__version__"
            exit 1
          fi

      - name: Verify release candidate
        run: |
          python -m compileall -q src
          python -m ruff check src tests
          python -m mypy src/animus_sdk
          python -m pytest --cov=animus_sdk --cov-branch --cov-fail-under=70

      - name: Build package
        run: |
          rm -rf dist build
          python -m build
          python -m twine check dist/*

      - name: Publish to PyPI with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
          attestations: true
